<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140">
  <!-- delivery truck, 3/4 rear view driving away -->
  <!-- cab peeking right -->
  <path d="M100 96 L100 44 Q100 36 108 36 L124 36 Q132 36 134 44 L138 62 Q140 74 140 96 Z" fill="#1cb0f6"/>
  <rect x="106" y="44" width="18" height="16" rx="4" fill="#c8ecff"/>
  <!-- cargo box rear -->
  <rect x="6" y="18" width="102" height="80" rx="12" fill="#f7f7f7"/>
  <rect x="6" y="18" width="102" height="80" rx="12" fill="none" stroke="#e2e2e2" stroke-width="4"/>
  <!-- rear doors -->
  <line x1="57" y1="22" x2="57" y2="94" stroke="#e2e2e2" stroke-width="4"/>
  <rect x="30" y="52" width="14" height="6" rx="3" fill="#d0d0d0"/>
  <rect x="70" y="52" width="14" height="6" rx="3" fill="#d0d0d0"/>
  <!-- kit-box logo small on the left door -->
  <g transform="translate(24 30)">
    <rect x="0" y="6" width="22" height="18" rx="5" fill="#ff9600"/>
    <rect x="0" y="0" width="22" height="9" rx="4.5" fill="#ffb14d"/>
    <rect x="9" y="0" width="4" height="24" fill="#e08600"/>
  </g>
  <!-- tail lights -->
  <rect x="10" y="82" width="12" height="8" rx="3" fill="#ff4b4b"/>
  <rect x="92" y="82" width="12" height="8" rx="3" fill="#ff4b4b"/>
  <!-- bumper -->
  <rect x="6" y="94" width="132" height="13" rx="6" fill="#9fb4c4"/>
  <!-- wheels -->
  <circle cx="34" cy="108" r="17" fill="#3c3c3c"/>
  <circle cx="34" cy="108" r="8" fill="#9fb4c4"/>
  <circle cx="104" cy="108" r="17" fill="#3c3c3c"/>
  <circle cx="104" cy="108" r="8" fill="#9fb4c4"/>
</svg>
