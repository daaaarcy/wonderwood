<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 220">
  <ellipse cx="90" cy="212" rx="60" ry="6" fill="#3c3c3c" opacity="0.08"/>
  <!-- trunk -->
  <path d="M82 210 q-4 -50 2 -84 l14 0 q6 34 2 84 z" fill="#96683f"/>
  <path d="M88 170 q-10 -8 -14 -20" fill="none" stroke="#7a5230" stroke-width="4" stroke-linecap="round"/>
  <!-- rope ladder -->
  <g stroke="#96683f" stroke-width="3.5" stroke-linecap="round">
    <line x1="40" y1="140" x2="36" y2="196"/>
    <line x1="58" y1="140" x2="54" y2="196"/>
    <line x1="38" y1="152" x2="57" y2="152"/>
    <line x1="37" y1="166" x2="56" y2="166"/>
    <line x1="36" y1="180" x2="55" y2="180"/>
  </g>
  <!-- platform -->
  <rect x="28" y="124" width="124" height="14" rx="7" fill="#c98a5a"/>
  <rect x="28" y="131" width="124" height="7" rx="3.5" fill="#a06a42"/>
  <g stroke="#a06a42" stroke-width="3.5" stroke-linecap="round">
    <line x1="36" y1="108" x2="36" y2="124"/><line x1="58" y1="106" x2="58" y2="124"/>
    <line x1="122" y1="106" x2="122" y2="124"/><line x1="144" y1="108" x2="144" y2="124"/>
    <line x1="30" y1="110" x2="150" y2="110"/>
  </g>
  <!-- house -->
  <rect x="62" y="70" width="64" height="56" rx="12" fill="#ffd98e"/>
  <path d="M54 76 q36 -36 72 0 z" fill="#ff9600"/>
  <rect x="82" y="92" width="20" height="34" rx="9" fill="#96683f"/>
  <circle cx="98" cy="110" r="2.5" fill="#ffc800"/>
  <circle cx="72" cy="88" r="7" fill="#eafbff"/>
  <circle cx="72" cy="88" r="3.5" fill="#ffffff"/>
  <!-- canopy -->
  <g fill="#58cc02">
    <circle cx="52" cy="52" r="30"/><circle cx="90" cy="34" r="38"/><circle cx="130" cy="52" r="30"/>
    <circle cx="70" cy="30" r="24"/><circle cx="112" cy="28" r="24"/>
  </g>
  <g fill="#46a302" opacity="0.6">
    <circle cx="46" cy="44" r="8"/><circle cx="134" cy="46" r="9"/><circle cx="92" cy="18" r="7"/>
  </g>
  <!-- flag -->
  <line x1="90" y1="34" x2="90" y2="4" stroke="#96683f" stroke-width="4" stroke-linecap="round"/>
  <path d="M90 6 l30 8 -30 8 z" fill="#ff9600"/>
  <path d="M90 6 l30 8 -30 0 z" fill="#e08600" opacity="0.5"/>
