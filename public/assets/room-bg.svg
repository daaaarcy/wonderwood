<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <!-- wall -->
  <rect width="1000" height="700" fill="#ffe9d2"/>
  <rect width="1000" height="120" fill="#fff3e4"/>
  <!-- floor: warm light wood -->
  <rect y="430" width="1000" height="270" fill="#f2c48d"/>
  <g stroke="#e0aa6b" stroke-width="4">
    <line x1="0" y1="470" x2="1000" y2="470"/>
    <line x1="0" y1="530" x2="1000" y2="530"/>
    <line x1="0" y1="590" x2="1000" y2="590"/>
    <line x1="0" y1="650" x2="1000" y2="650"/>
  </g>
  <!-- baseboard -->
  <rect y="418" width="1000" height="16" fill="#e0aa6b"/>

  <!-- pennant string -->
  <path d="M60 60 q200 70 420 30 q180 -30 300 10" fill="none" stroke="#777777" stroke-width="3.5"/>
  <g>
    <path d="M140 82 l14 22 l14 -18 z" fill="#58cc02"/>
    <path d="M230 100 l14 22 l14 -18 z" fill="#ffc800"/>
    <path d="M320 106 l14 22 l14 -18 z" fill="#ff4b4b"/>
    <path d="M410 104 l14 22 l14 -18 z" fill="#1cb0f6"/>
    <path d="M560 86 l14 22 l14 -18 z" fill="#ce82ff"/>
    <path d="M650 82 l14 22 l14 -18 z" fill="#ff9600"/>
  </g>

  <!-- round window -->
  <circle cx="770" cy="190" r="105" fill="#96683f"/>
  <circle cx="770" cy="190" r="92" fill="#eafbff"/>
  <circle cx="770" cy="190" r="88" fill="#7ed6f2"/>
  <g>
    <circle cx="730" cy="165" r="26" fill="#58cc02"/>
    <circle cx="762" cy="146" r="32" fill="#6ddb1e"/>
    <circle cx="814" cy="232" r="30" fill="#58cc02"/>
    <ellipse cx="752" cy="252" rx="46" ry="14" fill="#ffd98e"/>
    <circle cx="742" cy="172" r="9" fill="#ffc800"/>
    <ellipse cx="800" cy="150" rx="22" ry="10" fill="#ffffff" opacity="0.9"/>
  </g>
  <rect x="766" y="102" width="8" height="176" fill="#96683f"/>
  <rect x="682" y="186" width="176" height="8" fill="#96683f"/>

  <!-- framed picture -->
  <rect x="330" y="150" width="90" height="70" rx="10" fill="#ffffff"/>
  <rect x="330" y="150" width="90" height="70" rx="10" fill="none" stroke="#96683f" stroke-width="7"/>
  <path d="M342 200 l20 -24 l14 14 l16 -20 l16 30 z" fill="#58cc02"/>
  <circle cx="352" cy="168" r="7" fill="#ffc800"/>

  <!-- shelf with books -->
  <rect x="90" y="270" width="200" height="14" rx="7" fill="#c98a5a"/>
  <rect x="90" y="278" width="200" height="6" rx="3" fill="#a06a42"/>
  <g>
    <rect x="100" y="230" width="16" height="40" rx="4" fill="#ff4b4b"/>
    <rect x="120" y="226" width="14" height="44" rx="4" fill="#1cb0f6"/>
    <rect x="138" y="222" width="16" height="48" rx="4" fill="#ffc800"/>
    <rect x="158" y="234" width="12" height="36" rx="4" fill="#ce82ff"/>
    <rect x="174" y="228" width="14" height="42" rx="4" fill="#58cc02"/>
    <circle cx="220" cy="248" r="18" fill="#6ddb1e"/>
    <circle cx="220" cy="248" r="11" fill="#58cc02"/>
  </g>

  <!-- toy chest -->
  <g>
    <rect x="84" y="520" width="166" height="72" rx="14" fill="#ff9600"/>
    <rect x="84" y="520" width="166" height="72" rx="14" fill="none" stroke="#e08600" stroke-width="4"/>
    <rect x="88" y="508" width="166" height="34" rx="14" fill="#ffb14d"/>
    <rect x="88" y="508" width="166" height="34" rx="14" fill="none" stroke="#e08600" stroke-width="4"/>
    <rect x="158" y="540" width="24" height="22" rx="6" fill="#ffc800"/>
  </g>

  <!-- rug: sits inside the train-track oval (track is drawn by Phaser above it) -->
  <ellipse cx="620" cy="596" rx="160" ry="36" fill="#ffc800"/>
  <ellipse cx="620" cy="596" rx="128" ry="27" fill="#ffe066"/>
  <g fill="#58cc02">
    <ellipse cx="560" cy="596" rx="11" ry="6"/><ellipse cx="620" cy="593" rx="11" ry="6"/>
    <ellipse cx="680" cy="596" rx="11" ry="6"/>
  </g>
