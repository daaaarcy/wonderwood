<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <!-- ground -->
  <rect width="1000" height="700" fill="#7ed957"/>
  <rect width="1000" height="700" fill="#58cc02" opacity="0.25"/>

  <!-- treeline backdrop -->
  <g fill="#46a302">
    <circle cx="30" cy="40" r="55"/><circle cx="120" cy="20" r="48"/><circle cx="230" cy="35" r="50"/>
    <circle cx="480" cy="18" r="52"/><circle cx="560" cy="42" r="44"/><circle cx="720" cy="22" r="50"/>
    <circle cx="930" cy="30" r="55"/><circle cx="1010" cy="45" r="50"/>
  </g>
  <g fill="#58cc02">
    <circle cx="60" cy="30" r="40"/><circle cx="160" cy="10" r="36"/><circle cx="430" cy="30" r="36"/>
    <circle cx="620" cy="12" r="38"/><circle cx="880" cy="14" r="40"/><circle cx="960" cy="52" r="34"/>
  </g>

  <!-- stream across the bottom-left corner (Founders' Bridge crosses it) -->
  <path d="M0 580 q90 -10 160 30 q60 34 30 90 l-190 0 z" fill="#7ed6f2"/>
  <path d="M0 590 q85 -8 150 32" fill="none" stroke="#eafbff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <path d="M10 640 q60 -4 110 26" fill="none" stroke="#eafbff" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

  <!-- road: south from the square to the bottom edge -->
  <path d="M455 700 L455 545 Q455 500 500 500 L545 500 Q545 500 545 545 L545 700 Z" fill="#c9c9c9"/>
  <path d="M455 700 L455 545 Q455 500 500 500" fill="none" stroke="#afafaf" stroke-width="5"/>
  <path d="M545 700 L545 545 Q545 500 500 500" fill="none" stroke="#afafaf" stroke-width="5"/>
  <line x1="500" y1="700" x2="500" y2="548" stroke="#ffffff" stroke-width="6" stroke-dasharray="22 18"/>
  <!-- junction: short stub east from the square toward the road site -->
  <rect x="690" y="408" width="70" height="64" fill="#c9c9c9"/>

  <!-- town square: paved plaza -->
  <ellipse cx="500" cy="400" rx="235" ry="105" fill="#e8d9c0"/>
  <ellipse cx="500" cy="400" rx="235" ry="105" fill="none" stroke="#d8c4a0" stroke-width="6"/>
  <ellipse cx="500" cy="400" rx="200" ry="88" fill="#efe3cd"/>

  <!-- plaza center: big oak tree -->
  <rect x="486" y="330" width="28" height="80" rx="10" fill="#96683f"/>
  <g fill="#58cc02">
    <circle cx="500" cy="300" r="58"/><circle cx="452" cy="320" r="38"/><circle cx="548" cy="320" r="38"/>
    <circle cx="472" cy="272" r="36"/><circle cx="530" cy="270" r="36"/>
  </g>
  <g fill="#46a302" opacity="0.6">
    <circle cx="460" cy="332" r="10"/><circle cx="545" cy="330" r="10"/><circle cx="500" cy="336" r="12"/>
  </g>

  <!-- benches -->
  <g>
    <rect x="368" y="450" width="66" height="10" rx="5" fill="#c98a5a"/>
    <rect x="372" y="438" width="58" height="10" rx="5" fill="#c98a5a"/>
    <rect x="566" y="450" width="66" height="10" rx="5" fill="#c98a5a"/>
    <rect x="570" y="438" width="58" height="10" rx="5" fill="#c98a5a"/>
  </g>

  <!-- Theodore's house (blue roof) -->
  <g>
    <rect x="96" y="128" width="130" height="86" rx="14" fill="#fff3e4"/>
    <path d="M84 132 q77 -60 154 0 z" fill="#1cb0f6"/>
    <rect x="146" y="166" width="30" height="48" rx="9" fill="#96683f"/>
    <circle cx="169" cy="190" r="3" fill="#ffc800"/>
    <rect x="110" y="146" width="26" height="24" rx="6" fill="#eafbff"/>
    <rect x="186" y="146" width="26" height="24" rx="6" fill="#eafbff"/>
    <line x1="160" y1="72" x2="160" y2="96" stroke="#96683f" stroke-width="4"/>
    <path d="M160 74 l26 7 -26 7 z" fill="#1cb0f6"/>
  </g>

  <!-- Leonard's house (orange roof) -->
  <g>
    <rect x="774" y="128" width="130" height="86" rx="14" fill="#fff3e4"/>
    <path d="M762 132 q77 -60 154 0 z" fill="#ff9600"/>
    <rect x="824" y="166" width="30" height="48" rx="9" fill="#96683f"/>
    <circle cx="847" cy="190" r="3" fill="#ffc800"/>
    <rect x="788" y="146" width="26" height="24" rx="6" fill="#eafbff"/>
    <rect x="864" y="146" width="26" height="24" rx="6" fill="#eafbff"/>
    <line x1="840" y1="72" x2="840" y2="96" stroke="#96683f" stroke-width="4"/>
    <path d="M840 74 l26 7 -26 7 z" fill="#ff9600"/>
  </g>

  <!-- flowers + bushes sprinkled about -->
  <g>
    <circle cx="60" cy="330" r="6" fill="#ff4b4b"/><circle cx="80" cy="344" r="5" fill="#ffc800"/>
    <circle cx="945" cy="330" r="6" fill="#ce82ff"/><circle cx="925" cy="346" r="5" fill="#ff4b4b"/>
    <circle cx="640" cy="610" r="6" fill="#ce82ff"/><circle cx="662" cy="624" r="5" fill="#ffffff"/>
    <circle cx="300" cy="650" r="6" fill="#ffc800"/><circle cx="320" cy="640" r="5" fill="#ff4b4b"/>
    <ellipse cx="50" cy="470" rx="22" ry="14" fill="#46a302"/>
    <ellipse cx="955" cy="500" rx="22" ry="14" fill="#46a302"/>
  </g>

  <!-- empty plot hints (soft darker grass ovals at building spots) -->
  <g fill="#46a302" opacity="0.35">
    <ellipse cx="225" cy="560" rx="110" ry="48"/>
    <ellipse cx="760" cy="575" rx="110" ry="48"/>
    <ellipse cx="340" cy="200" rx="105" ry="44"/>
    <ellipse cx="660" cy="195" rx="105" ry="44"/>
  </g>
</svg>
