<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <defs>
    <linearGradient id="tShirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3bb3a2"/>
      <stop offset="1" stop-color="#2e9e8f"/>
    </linearGradient>
    <radialGradient id="tSkin" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#ffd9b0"/>
      <stop offset="1" stop-color="#f6c89f"/>
    </radialGradient>
  </defs>
  <!-- soft ground shadow -->
  <ellipse cx="100" cy="231" rx="46" ry="7" fill="#4a3226" opacity="0.12"/>
  <!-- legs -->
  <rect x="78" y="186" width="16" height="30" rx="8" fill="#f6c89f" stroke="#4a3226" stroke-width="3.5"/>
  <rect x="106" y="186" width="16" height="30" rx="8" fill="#f6c89f" stroke="#4a3226" stroke-width="3.5"/>
  <!-- boots -->
  <path d="M72 206 h26 v14 q0 8 -8 8 h-18 q-6 0 -6 -6 z" fill="#8a5a3b" stroke="#4a3226" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M102 206 h26 v14 q0 8 -8 8 h-18 q-6 0 -6 -6 z" fill="#8a5a3b" stroke="#4a3226" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- shorts -->
  <path d="M70 168 h60 v18 q0 8 -8 8 h-16 l-6 -12 -6 12 h-16 q-8 0 -8 -8 z" fill="#7a4f33" stroke="#4a3226" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- arms -->
  <path d="M66 128 q-16 10 -14 34 q1 10 10 9 q7 -1 8 -10 l2 -22 z" fill="url(#tShirt)" stroke="#4a3226" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M134 128 q16 10 14 34 q-1 10 -10 9 q-7 -1 -8 -10 l-2 -22 z" fill="url(#tShirt)" stroke="#4a3226" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- hands -->
  <circle cx="60" cy="168" r="8" fill="#f6c89f" stroke="#4a3226" stroke-width="3.5"/>
  <circle cx="140" cy="168" r="8" fill="#f6c89f" stroke="#4a3226" stroke-width="3.5"/>
  <!-- body / tunic -->
  <path d="M68 118 q-4 30 2 54 q2 8 12 8 h36 q10 0 12 -8 q6 -24 2 -54 q-2 -10 -14 -10 h-36 q-12 0 -14 10 z" fill="url(#tShirt)" stroke="#4a3226" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- backpack straps -->
  <path d="M80 116 q-3 24 0 46" fill="none" stroke="#1f7a6e" stroke-width="6" stroke-linecap="round"/>
  <path d="M120 116 q3 24 0 46" fill="none" stroke="#1f7a6e" stroke-width="6" stroke-linecap="round"/>
  <!-- neckerchief -->
  <path d="M82 112 h36 l-18 22 z" fill="#e76f51" stroke="#4a3226" stroke-width="3.5" stroke-linejoin="round"/>
  <circle cx="100" cy="113" r="5" fill="#d35a3c" stroke="#4a3226" stroke-width="3"/>
  <!-- ears -->
  <circle cx="63" cy="64" r="7" fill="#f6c89f" stroke="#4a3226" stroke-width="3"/>
  <circle cx="137" cy="64" r="7" fill="#f6c89f" stroke="#4a3226" stroke-width="3"/>
  <!-- head -->
  <circle cx="100" cy="62" r="38" fill="url(#tSkin)" stroke="#4a3226" stroke-width="3.5"/>
  <!-- hair: warm brown floppy fringe -->
  <path d="M62 58 q-4 -34 38 -36 q42 2 38 36 q-8 -14 -18 -16 q4 8 2 12 q-10 -14 -22 -16 q-20 -2 -30 10 q-4 6 -8 10 z"
        fill="#6b4226" stroke="#4a3226" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M74 34 q6 -8 16 -9" fill="none" stroke="#8a5a3b" stroke-width="4" stroke-linecap="round"/>
  <!-- face -->
  <circle cx="86" cy="62" r="4.5" fill="#4a3226"/>
  <circle cx="114" cy="62" r="4.5" fill="#4a3226"/>
  <circle cx="87.5" cy="60.5" r="1.4" fill="#fffdf6"/>
  <circle cx="115.5" cy="60.5" r="1.4" fill="#fffdf6"/>
  <ellipse cx="76" cy="74" rx="7" ry="4.5" fill="#f2a03d" opacity="0.45"/>
  <ellipse cx="124" cy="74" rx="7" ry="4.5" fill="#f2a03d" opacity="0.45"/>
  <path d="M90 78 q10 9 20 0" fill="none" stroke="#4a3226" stroke-width="3.5" stroke-linecap="round"/>
</svg>
